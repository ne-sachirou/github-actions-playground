---
name: on pull_request Go

"on":
  pull_request:
    paths:
      - go-app/**
      # Go用CI自体の変更も検証する。
      - .github/workflows/on-pull_request-go.yaml
      - .github/workflows/wf-check-go.yaml

jobs:
  check-go:
    permissions:
      contents: read
    uses: ./.github/workflows/wf-check-go.yaml # zizmor: ignore[self-repository]
